<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171b1b"><title>Cocktail Lab</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#121717;color:#f4f2e9}body{margin:0}header,main{max-width:960px;margin:auto;padding:24px}header{padding-top:60px}h1{font-size:clamp(2.5rem,7vw,4.5rem);margin:8px 0}.sub{color:#b9c1bc}input{width:100%;box-sizing:border-box;padding:15px;border-radius:12px;border:1px solid #52605b;background:#202827;color:white;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:24px}.card{background:#202827;border:1px solid #35413d;border-radius:16px;padding:20px}.card h2{margin:8px 0}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-bottom:10px}.group{grid-column:1/-1;border-bottom:1px solid #52605b;padding-top:22px;padding-bottom:8px;font-size:1.45rem;margin:0}.photo-note{color:#a9b9b1;font-size:12px}.pill{display:inline-block;border:1px solid #5a746b;border-radius:50px;padding:4px 9px;margin:4px 4px 0 0;font-size:12px;color:#c6d9d0}details{margin-top:12px}summary{cursor:pointer}li{margin-bottom:7px}a{color:#c2dcca}small{color:#b9c1bc}</style></head>
<body><header><small>ANAV42 / COCKTAIL LAB</small><h1>Cocktail Lab</h1><p class="sub">Discover, reconstruct and share extraordinary cocktails.</p></header><main><label for="q">Search cocktails, ingredients, bars or flavors</label><input id="q" type="search" placeholder="Try rum, smoky, Honolulu…"><p id="count" class="sub"></p><div id="recipes" class="grid"></div></main>
<script>
let recipes=[];const q=document.getElementById('q'),out=document.getElementById('recipes'),count=document.getElementById('count');function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function spirit(r){if(r.baseSpirit)return r.baseSpirit;const t=(r.tags||[]).map(x=>x.toLowerCase());if(t.includes('rum'))return 'Rum';if(t.includes('whisky')||t.includes('whiskey')||t.includes('bourbon'))return 'Whiskey';if(t.includes('gin'))return 'Gin';if(t.includes('tequila'))return 'Tequila';if(t.includes('vodka'))return 'Vodka';if(t.includes('brandy'))return 'Brandy';if(t.includes('mezcal'))return 'Mezcal';return 'Other'}
function render(){out.replaceChildren();const term=q.value.trim().toLowerCase();const hits=recipes.filter(r=>JSON.stringify(r).toLowerCase().includes(term)).sort((a,b)=>spirit(a).localeCompare(spirit(b))||a.name.localeCompare(b.name));count.textContent=hits.length+' cocktail'+(hits.length===1?'':'s')+' · grouped by base spirit, then A–Z';if(!hits.length){out.append(el('p',recipes.length?'No matching cocktails yet.':'Recipes are being prepared. Check back soon.'));return}let last='';for(const r of hits){const category=spirit(r);if(category!==last){const heading=el('h2',category);heading.className='group';out.append(heading);last=category}const c=el('article');c.className='card';if(r.image){const pic=document.createElement('img');pic.className='photo';pic.src=r.image;pic.alt=r.name+' cocktail photograph';pic.loading='lazy';pic.onerror=()=>pic.remove();c.append(pic)}c.append(el('small',(r.bar||'Original cocktail')+(r.city?' · '+r.city:'')),el('h2',r.name),el('p',r.notes||''));const tags=el('div');for(const t of r.tags||[]){const s=el('span',t);s.className='pill';tags.append(s)}c.append(tags,el('small','Status: '+r.status));const d=el('details'),s=el('summary','View reconstruction');d.append(s);if(r.observations?.length){d.append(el('h3','Original observations'));const ul=el('ul');r.observations.forEach(x=>ul.append(el('li',x)));d.append(ul)}if(r.recipe?.ingredients?.length){d.append(el('h3','Ingredients'));const ul=el('ul');r.recipe.ingredients.forEach(x=>ul.append(el('li',x.quantity+' '+x.name+(x.certainty==='observed'?'':' (estimate)'))));d.append(ul)}if(r.recipe?.steps?.length){d.append(el('h3','Method'));const ol=el('ol');r.recipe.steps.forEach(x=>ol.append(el('li',x)));d.append(ol)}if(r.unresolvedQuestions?.length){d.append(el('h3','Still to determine'));const ul=el('ul');r.unresolvedQuestions.forEach(x=>ul.append(el('li',x)));d.append(ul)}c.append(d);out.append(c)}}
q.addEventListener('input',render);fetch('./data/recipes.json').then(r=>{if(!r.ok)throw Error('catalog unavailable');return r.json()}).then(d=>{recipes=d.recipes||[];render()}).catch(()=>{count.textContent='Unable to load recipes. Please try again later.'});</script></body></html>
