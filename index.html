<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111717"><title>Cocktail Lab</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#111717;color:#f5f2e9}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:24px}header{padding-top:55px}h1{font-size:clamp(2.8rem,7vw,5rem);letter-spacing:-.055em;margin:8px 0}p{line-height:1.55}.sub{color:#b8c5bf}input,select{padding:13px;border-radius:10px;border:1px solid #53645c;background:#1e2825;color:white;font-size:16px}input{flex:1;min-width:180px}.controls{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;margin-top:22px}.group{grid-column:1/-1;border-bottom:1px solid #405149;padding:20px 0 10px;margin:0;font-size:1.5rem}.card{border-radius:16px;overflow:hidden;background:#1d2723;border:1px solid #35453d;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;transition:transform .15s,border-color .15s}.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:#9cbba7}.photo{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.placeholder{aspect-ratio:4/5;display:grid;place-items:center;background:linear-gradient(140deg,#24382f,#14201d);color:#829c8d;font-size:52px}.info{padding:17px}.info h3{font-size:1.45rem;margin:4px 0}.info small{color:#c1cbc4}.pill{display:inline-block;border:1px solid #5a746b;border-radius:50px;padding:4px 9px;margin:4px 4px 0 0;font-size:12px;color:#c6d9d0}.modal{border:1px solid #455b50;border-radius:18px;background:#17211d;color:#f5f2e9;width:min(720px,94vw);max-height:90vh;overflow:auto;padding:24px}.modal::backdrop{background:#000b}.close{float:right;background:#35453d;color:white;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.modal h2{font-size:2rem}.detail-photo{width:100%;max-height:400px;object-fit:contain;border-radius:10px;background:#101815}.section{border-top:1px solid #35453d;margin-top:20px;padding-top:10px}li{margin:8px 0}small{color:#b8c5bf}#count{color:#b8c5bf}button{font:inherit}@media(max-width:480px){header{padding-top:35px}.modal{padding:16px}}
</style></head><body><header><small>ANAV42 / COCKTAIL LAB</small><h1>Cocktail Lab</h1><p class="sub">A collection of extraordinary cocktails, reconstructed from real experiences.</p></header><main><div class="controls"><input id="q" type="search" aria-label="Search cocktails" placeholder="Search drinks, bars, ingredients…"><select id="spirit" aria-label="Filter by base spirit"><option value="">All spirits</option></select></div><p id="count"></p><div id="recipes" class="grid"></div></main><dialog id="detail" class="modal"><button id="close" class="close" aria-label="Close">Close ✕</button><div id="detail-content"></div></dialog>
<script>
let recipes=[];const q=document.getElementById('q'),out=document.getElementById('recipes'),count=document.getElementById('count'),filter=document.getElementById('spirit'),modal=document.getElementById('detail'),body=document.getElementById('detail-content');document.getElementById('close').onclick=()=>modal.close();function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}function spirit(r){if(r.baseSpirit)return r.baseSpirit;const t=(r.tags||[]).join(' ').toLowerCase();return t.includes('rum')?'Rum':/whisk|bourbon/.test(t)?'Whiskey':t.includes('gin')?'Gin':t.includes('tequila')?'Tequila':t.includes('vodka')?'Vodka':t.includes('mezcal')?'Mezcal':'Other'}function photo(r,cls){if(!r.image)return null;const i=el('img');i.className=cls;i.src=r.image;i.alt='Original photograph of '+r.name;i.loading='lazy';return i}function list(parent,heading,items,ordered=false){if(!items?.length)return;const section=el('section');section.className='section';section.append(el('h3',heading));const ul=el(ordered?'ol':'ul');items.forEach(x=>ul.append(el('li',x)));section.append(ul);parent.append(section)}
function openRecipe(r){body.replaceChildren();const img=photo(r,'detail-photo');if(img){img.onerror=()=>img.remove();body.append(img)}body.append(el('h2',r.name),el('p',(r.bar||'Original cocktail')+(r.city?' · '+r.city:'')),el('p',r.notes||''));list(body,'Ingredients',(r.recipe?.ingredients||[]).map(x=>x.quantity+' — '+x.name+(x.certainty==='experimental'?' (estimated)':'')));list(body,'Preparation',r.recipe?.steps,true);list(body,'Original observations',r.observations);list(body,'Still to determine',r.unresolvedQuestions);modal.showModal();history.replaceState(null,'','#'+encodeURIComponent(r.id))}
function render(){out.replaceChildren();const term=q.value.trim().toLowerCase();const hits=recipes.filter(r=>(!filter.value||spirit(r)===filter.value)&&JSON.stringify(r).toLowerCase().includes(term)).sort((a,b)=>spirit(a).localeCompare(spirit(b))||a.name.localeCompare(b.name));count.textContent=hits.length+' cocktail'+(hits.length===1?'':'s')+' · grouped by base spirit, then A–Z';if(!hits.length){out.append(el('p','No matching cocktails yet.'));return}let last='';for(const r of hits){const category=spirit(r);if(category!==last){const h=el('h2',category);h.className='group';out.append(h);last=category}const card=el('button');card.className='card';const img=photo(r,'photo');if(img){img.onerror=()=>{const ph=el('div','◈');ph.className='placeholder';img.replaceWith(ph)};card.append(img)}else{const ph=el('div','◈');ph.className='placeholder';card.append(ph)}const info=el('div');info.className='info';info.append(el('h3',r.name),el('small',(r.bar||'Original cocktail')+(r.city?' · '+r.city:'')));card.append(info);card.onclick=()=>openRecipe(r);out.append(card)}}
q.oninput=render;filter.onchange=render;fetch('./data/recipes.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog unavailable');return r.json()}).then(d=>{recipes=d.recipes||[];[...new Set(recipes.map(spirit))].sort().forEach(s=>{const opt=el('option',s);opt.value=s;filter.append(opt)});render();const id=decodeURIComponent(location.hash.slice(1));const selected=recipes.find(r=>r.id===id);if(selected)openRecipe(selected)}).catch(()=>{count.textContent='Unable to load recipes. Please try again later.'});modal.addEventListener('close',()=>{if(location.hash)history.replaceState(null,'',location.pathname+location.search)});</script></body></html>
