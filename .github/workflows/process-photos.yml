name: Process cocktail photo submissions
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: cocktail-photo-submissions
  cancel-in-progress: false
jobs:
  process:
    if: startsWith(github.event.issue.title, 'Photo:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - name: Process photo
        id: process
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/process_photo_issue.py
      - name: Commit photo and recipe
        if: steps.process.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images data/recipes.json
          git commit -m "Add photo from issue #${{ github.event.issue.number }}"
          git push
      - name: Confirm submission
        if: success() && steps.process.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "Photo processed and added to the recipe gallery. The website will update after the next Pages deployment."
